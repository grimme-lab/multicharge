name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "doc*/**"
      - "./*.ya?ml"
      - "**/*.md"
      - "**/*.rst"

  pull_request:
    paths-ignore:
      - "doc*/**"
      - "./*.ya?ml"
      - "**/*.md"
      - "**/*.rst"

  workflow_dispatch:

env:
  BUILD_DIR: _build
  PIP_PACKAGES: >-
    meson!=1.8.0
    cmake
    ninja
    gcovr>=8.7
    numpy
    pytest

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build: [meson, cmake]
        build-type: [debug]
        compiler: [gcc]
        version: [14]

        include:
        - os: ubuntu-latest
          build: meson
          build-type: coverage
          compiler: gcc
          version: 11

        - os: ubuntu-latest
          build: fpm
          build-type: debug
          compiler: gcc
          version: 12

        - os: macos-15-intel
          build: meson
          build-type: debug
          compiler: gcc
          version: 12

        - os: windows-latest
          build: meson
          build-type: debug
          compiler: msys
          version: 10

        - os: ubuntu-latest
          build: meson
          build-type: debug
          compiler: intel-classic
          version: '2023.0'
          mkl-version: '2023.0.0'

        - os: ubuntu-latest
          build: meson
          build-type: debug
          compiler: intel
          version: '2025.1'
          mkl-version: '2025.1'

    defaults:
      run:
        shell: ${{ matrix.compiler == 'msys' && 'msys2 {0}' || 'bash' }}

    env:
      PYTHON_V: "3.14"
      OMP_NUM_THREADS: 1,2,1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_V }}

    - name: Install LAPACK (macOS)
      if: ${{ contains(matrix.os, 'macos') && matrix.compiler == 'gcc' }}
      run: |
        brew install openblas
        echo "PKG_CONFIG_PATH=$(brew --prefix openblas)/lib/pkgconfig" >> $GITHUB_ENV
        echo "LDFLAGS=-L$(brew --prefix openblas)/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I$(brew --prefix openblas)/include" >> $GITHUB_ENV

    - name: Install LAPACK (Linux)
      if: ${{ contains(matrix.os, 'ubuntu') && matrix.compiler == 'gcc' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y libblas-dev liblapack-dev

    - name: Install fpm
      if: ${{ matrix.build == 'fpm' }}
      uses: fortran-lang/setup-fpm@v12
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install GCC (Windows)
      if: ${{ contains(matrix.os, 'windows') && matrix.compiler == 'msys' }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: >-
          git
          mingw-w64-x86_64-python
          mingw-w64-x86_64-python-pip
          mingw-w64-x86_64-python-setuptools
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-gcc-fortran
          mingw-w64-x86_64-openblas
          mingw-w64-x86_64-lapack
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-meson
          mingw-w64-x86_64-ninja

    - name: Install GCC compiler
      if: ${{ matrix.compiler == 'gcc' }}
      uses: fortran-lang/setup-fortran@v1
      with:
        compiler: ${{ matrix.compiler }}
        version: ${{ matrix.version }}

    - name: Prepare for cache restore
      if: ${{ contains(matrix.compiler, 'intel') }}
      run: |
        sudo mkdir -p /opt/intel
        sudo chown $USER /opt/intel

    - name: Cache Intel install
      if: ${{ contains(matrix.compiler, 'intel') }}
      id: cache-install
      uses: actions/cache@v4
      with:
        path: /opt/intel/oneapi
        key: install-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.mkl-version }}-${{ matrix.os }}

    - name: Install Intel compiler (Linux)
      if: ${{ contains(matrix.os, 'ubuntu') && contains(matrix.compiler, 'intel') && steps.cache-install.outputs.cache-hit != 'true' }}
      uses: fortran-lang/setup-fortran@v1
      with:
        compiler: ${{ matrix.compiler }}
        version: ${{ matrix.version }}

    - name: Install Intel MKL (Linux)
      if: ${{ contains(matrix.os, 'ubuntu') && contains(matrix.compiler, 'intel') && steps.cache-install.outputs.cache-hit != 'true' }}
      run: |
        sudo apt-get install -y intel-oneapi-mkl-${{ matrix.mkl-version }} intel-oneapi-mkl-devel-${{ matrix.mkl-version }}

    - name: Setup Intel oneAPI environment
      if: ${{ contains(matrix.compiler, 'intel') }}
      run: |
        source /opt/intel/oneapi/setvars.sh --force
        printenv >> $GITHUB_ENV

    - name: Setup compiler environment
      run: |
        case "${{ matrix.compiler }}" in
          gcc)
            FC="gfortran-${{ matrix.version }}"
            CC="gcc-${{ matrix.version }}"
            ;;
          msys)
            FC="gfortran"
            CC="gcc"
            ;;
          intel)
            FC="ifx"
            CC="icx"
            ;;
          intel-classic)
            FC="ifort"
            CC="icc"
            ;;
        esac
        echo "FC=$FC" >> $GITHUB_ENV
        echo "CC=$CC" >> $GITHUB_ENV

    - name: Install build and test dependencies
      if: ${{ ! contains(matrix.os, 'windows') && matrix.build != 'fpm' }}
      run: pip3 install ${{ env.PIP_PACKAGES }}

    - name: Install build and test dependencies
      if: ${{ contains(matrix.os, 'windows') }}
      run: pip3 install meson==0.60

    - name: Check gfortran version for meson build
      if: ${{ matrix.build == 'meson' && matrix.compiler == 'gcc' }}
      run: |
        $FC --version
        which $FC

    - name: Configure build (meson)
      if: ${{ matrix.build == 'meson' }}
      run: >-
        meson setup ${{ env.BUILD_DIR }}
        --buildtype=debug
        --prefix=$PWD/_dist
        --libdir=lib
        --warnlevel=0
        -Db_coverage=${{ env.COVERAGE }}
        ${{ env.MESON_ARGS }}
      env:
        COVERAGE: ${{ matrix.build-type == 'coverage' }}
        MESON_ARGS: >-
          ${{ contains(matrix.compiler, 'intel') && '-Dfortran_link_args=-qopenmp' || '' }}
          ${{ contains(matrix.os, 'macos') && '-Dlapack=openblas' || '' }}
          ${{ (matrix.compiler == 'msys' || matrix.build-type == 'coverage') && '-Dopenmp=false' || '' }}

    - name: Configure build (CMake)
      if: ${{ matrix.build == 'cmake' }}
      run: >-
        cmake -B${{ env.BUILD_DIR }}
        -GNinja
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_INSTALL_PREFIX=$PWD/_dist
        -DCMAKE_INSTALL_LIBDIR=lib
        -DCMAKE_Fortran_COMPILER=${{ env.FC }}

    - name: Build library (fpm)
      if: ${{ matrix.build == 'fpm' }}
      run: fpm build

    - name: Build library
      if: ${{ matrix.build != 'fpm' }}
      run: ninja -C ${{ env.BUILD_DIR }}

    - name: Run unit tests (fpm)
      if: ${{ matrix.build == 'fpm' }}
      run: fpm test
      env:
        OMP_NUM_THREADS: 1

    - name: Run unit tests
      if: ${{ matrix.build == 'meson' }}
      run: |
        meson test -C ${{ env.BUILD_DIR }} --print-errorlogs --no-rebuild
      env:
        OMP_NUM_THREADS: 1
        MKL_NUM_THREADS: 1

    - name: Run validation tests
      if: ${{ matrix.build == 'meson' && ! contains(matrix.os, 'windows') }}
      run: |
        meson test -C ${{ env.BUILD_DIR }} --print-errorlogs --no-rebuild --suite multicharge --benchmark
      env:
        OMP_NUM_THREADS: 1
        MKL_NUM_THREADS: 1

    - name: Run unit tests
      if: ${{ matrix.build == 'cmake' }}
      run: |
        ctest --output-on-failure --parallel 2
      working-directory: ${{ env.BUILD_DIR }}

    # Use gcovr directly instead of `ninja -C _build coverage` for explicit filtering.
    # Requires gcovr >= 8.7 (Python >= 3.10) so Fortran module procedures
    # (`__<mod>_MOD_<proc>`) are preserved natively while compiler-synthesized
    # OOP vtable thunks (`___copy_*`, `___final_*`) remain excluded.
    - name: Create coverage report
      if: ${{ matrix.build == 'meson' && matrix.build-type == 'coverage' }}
      run: |
        gcovr ${{ env.BUILD_DIR }} \
          --root . \
          --filter "app/" \
          --filter "src/" \
          --exclude "subprojects/" \
          --exclude "test/" \
          --cobertura coverage.xml \
          --txt-summary

    - name: Install project
      if: ${{ matrix.build != 'fpm' }}
      run: |
        ninja -C ${{ env.BUILD_DIR }} install
        echo "MCHRG_PREFIX=$PWD/_dist" >> $GITHUB_ENV

    - name: Discover installed files (CMake)
      if: ${{ matrix.build != 'fpm' && ! contains(matrix.compiler, 'intel') && ! contains(matrix.os, 'macos') }}
      run: |
        cmake -S test/export -B ${{ env.BUILD_DIR }}/discover-cmake -G Ninja -DCMAKE_PREFIX_PATH=$PWD/_dist/lib/cmake
        cmake --build ${{ env.BUILD_DIR }}/discover-cmake

    - name: Discover installed files (Meson)
      if: ${{ matrix.build != 'fpm' && ! contains(matrix.os, 'macos') }}
      run: |
        meson setup ${{ env.BUILD_DIR }}/discover-meson test/export --pkg-config-path=$PWD/_dist/lib/pkgconfig
        meson compile -C ${{ env.BUILD_DIR }}/discover-meson

    - name: Create package
      if: ${{ matrix.build == 'meson' }}
      run: |
        tar cvf ${{ env.OUTPUT }} _dist
        xz -T0 ${{ env.OUTPUT }}
        echo "MCHRG_OUTPUT=${{ env.OUTPUT }}.xz" >> $GITHUB_ENV
      env:
        OUTPUT: multicharge-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.os }}.tar

    - name: Upload package
      if: ${{ matrix.build == 'meson' && matrix.build-type != 'coverage' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.MCHRG_OUTPUT }}
        path: ${{ env.MCHRG_OUTPUT }}

    - name: Upload coverage report
      if: ${{ matrix.build == 'meson' && matrix.build-type == 'coverage' }}
      uses: codecov/codecov-action@v5
      with:
        files: coverage.xml
        disable_search: true
        fail_ci_if_error: false
        flags: fortran

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Run pre-commit checks
      run: pre-commit run -a
